<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>CV · Eduardo Ramos Mendoza</title>
  <meta name="description" content="Currículum de Eduardo Ramos Mendoza / Curriculum vitae." />
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #555; --line: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #ececec; --muted: #a8a8a8; --line: #ececec; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg); font: 18px/1.5 Georgia, 'Times New Roman', serif; }
    main { width: 100%; max-width: 420px; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a.btn { display: block; padding: 1rem 1.25rem; margin-bottom: .75rem; border: 2px solid var(--line);
      color: var(--fg); text-decoration: none; font-size: 1.1rem; }
    a.btn:hover, a.btn:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
    small { display: block; color: var(--muted); font-size: .85rem; }
    footer { margin-top: 1.5rem; font-size: .9rem; }
    footer a { color: var(--muted); }
  </style>
</head>
