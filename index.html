<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eduardo Ramos Mendoza — Ingeniero en Sistemas Computacionales. Infraestructura de alto rendimiento y agentes LLM, arquitectura de procesadores, diseño en FPGA, programación de redes y desarrollo full-stack. Cada afirmación lleva su evidencia."
    />
    <title>Eduardo Ramos Mendoza</title>
    <!-- THEME_BOOT_SCRIPT from phyriad-react 1.0.0 (verbatim): the stored colour
         scheme applies before first paint, so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('phy-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  <!-- Made with my soul - Swately <3 -->
</html>
